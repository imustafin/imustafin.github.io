services:
  app:
    build:
      context: .
    stdin_open: true
    tty: true
    volumes:
      - .:/app:cached
      - bundle:/bundle:cached
      # - ../jekyll-seo-tag:/jekyll-seo-tag # uncomment for local jekyll-seo-tag
    command: /bin/bash
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:35729:35729

volumes:
  bundle:
